plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: android/keystore.properties (gitignored), created once with keytool.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

android {
    namespace 'app.trustcam'
    compileSdk 36

    defaultConfig {
        applicationId 'app.trustcam'
        minSdk 29
        targetSdk 35
        versionCode 31
        versionName '1.5.2'
        buildConfigField 'String', 'BASE_URL', '"https://trustcam.gregoriogalante.com"'
        // ORT native libs are heavy; every modern Android phone is arm64
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // cleartext HTTP allowed only in debug, for LAN development
            manifestPlaceholders = [cleartext: 'true']
        }
        release {
            manifestPlaceholders = [cleartext: 'false']
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        // c2pa-android pulls bouncycastle jars with duplicate OSGI manifests
        resources.excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Keep the watermark model assets uncompressed (memory-mappable)
    androidResources {
        noCompress 'onnx'
    }
}

dependencies {
    // On-device watermark embedding (runs the exported VideoSeal graphs)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    // C2PA manifest embedding (Content Credentials)
    implementation 'com.github.contentauth:c2pa-android:0.0.9'
    testImplementation 'junit:junit:4.13.2'
    def camerax = '1.4.1'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-video:$camerax"
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
