plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.spike.seitest'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.spike.seitest'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep the model asset uncompressed
    androidResources {
        noCompress 'onnx'
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
    // implementation (not androidTestImplementation): instrumented tests run in the
    // app process, so the native .so must ship in the app APK
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
