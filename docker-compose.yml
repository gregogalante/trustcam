services:
  trustcam:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'   # reverse proxy (nginx/caddy) terminates TLS and forwards here
    environment:
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      - trustcam-data:/data

volumes:
  trustcam-data:
